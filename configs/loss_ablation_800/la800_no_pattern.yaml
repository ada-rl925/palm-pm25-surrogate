_note: full-domain (800) loss ablation (no_pattern); baseline = full_domain
data:
  batch_size: 1
  dataloader: v2
  em_bg_norm: true
  global_pm_norm: false
  num_workers: 2
  roi: null
  t_hist: 1
  test_hours:
    london_cm20190720-23:
    - 1
    - 25
    london_cm20190820-23:
    - 25
    - 49
    london_cm20190904-07:
    - 49
    - 73
  val_hours: {}
  z_range:
  - 0
  - 12
experiment:
  name: la800_no_pattern
  output_dir: outputs/ablation_loss
  seed: 42
logging:
  log_every: 10
loss:
  high_weight: 0.0
  lambda_anom: 1.0
  lambda_grad: 1.0
  lambda_nonneg: 0.1
  lambda_pattern: 0.0
  lambda_smooth: 0.0
  lambda_spectral: 1.0
  name: physics
  pattern_min_std: 0.01
model:
  base_ch: 16
  dropout: 0.1
  in_ch: 18
  n_down: 4
  name: UNet3DFiLM
  spatial_ch: 2
  use_attention: true
training:
  early_stop_patience: 9999
  epochs: 300
  grad_clip: 1.0
  lr: 0.0001
  scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    name: plateau
    patience: 10
  weight_decay: 0.005
