experiment:
  name: future_transfer
  seed: 42
  output_dir: outputs
data:
  roi: null
  dataloader: v2
  global_pm_norm: false
  em_bg_norm: true
  z_range:
  - 0
  - 12
  t_hist: 1
  batch_size: 1
  num_workers: 2
  val_hours: {}
  # Temporal episode holdout: train on Jul + Aug, test on the whole Sep episode.
  # Sep hours 1-144 -> test; Jul & Aug have no test hours, so they are fully train.
  test_hours:
    london_cm20190904-07:
    - 1
    - 145
model:
  name: UNet3DFiLM
  in_ch: 18
  spatial_ch: 2
  base_ch: 16
  dropout: 0.1
  use_attention: true
  n_down: 4
training:
  epochs: 300
  early_stop_patience: 20
  lr: 0.0001
  weight_decay: 0.005
  grad_clip: 1.0
  scheduler:
    name: plateau
    patience: 10
    factor: 0.5
    min_lr: 1.0e-06
loss:
  name: physics
  lambda_nonneg: 0.1
  lambda_anom: 1.0
  lambda_grad: 1.0
  lambda_pattern: 1.0
  pattern_min_std: 0.01
  high_weight: 0.0
  lambda_spectral: 1.0
logging:
  log_every: 10
_note: future transfer — train Jul+Aug, test held-out Sep; full-domain, same recipe as full_domain
