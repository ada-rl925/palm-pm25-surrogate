experiment:
  name: ft_600
  seed: 42
  output_dir: outputs/data_scaling
data:
  roi: null
  dataloader: v2
  global_pm_norm: false
  em_bg_norm: true
  z_range:
  - 0
  - 12
  t_hist: 1
  batch_size: 1
  num_workers: 2
  val_hours: {}
  mask_input: true
  # Future transfer across years: train on ALL available 2019 episodes (Jul/Aug/Sep
  # + the four Oct 2019 segments, all hours), test on the two September 2020 episodes.
  # One 2019 run is not out yet (Aug 24-31, errored) — excluded, run regardless.
  sims:
  - london_cm20190720-23
  - london_cm20190820-23
  - london_cm20190904-07
  - london_cm20191002-1003
  - london_cm20191018-1019
  - london_cm20191021-1022
  - london_cm20191026-1028
  - london_cm20200904-0906
  - london_cm20200906-0908
  test_hours:
    london_cm20200904-0906:
    - 1
    - 49
    london_cm20200906-0908:
    - 1
    - 49
model:
  name: UNet3DFiLM
  in_ch: 19
  spatial_ch: 3
  base_ch: 16
  dropout: 0.1
  use_attention: true
  n_down: 4
training:
  epochs: 300
  early_stop_patience: 20
  lr: 0.0001
  weight_decay: 0.005
  grad_clip: 1.0
  scheduler:
    name: plateau
    patience: 10
    factor: 0.5
    min_lr: 1.0e-06
loss:
  name: physics
  lambda_nonneg: 0.1
  lambda_anom: 1.0
  lambda_grad: 1.0
  lambda_pattern: 1.0
  pattern_min_std: 0.01
  high_weight: 0.0
  lambda_spectral: 1.0
logging:
  log_every: 10
_note: future transfer 2019->2020; train all 2019 episodes, test Sep 2020 (both). Reads the compact dataset under data/ (new episodes compacted by scripts/build_data_newdata.py); no PALM_DATA_DIR needed.
